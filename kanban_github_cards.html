
<style>
  h2.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  .iter-section{margin-bottom:2rem}
  .iter-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.6rem}
  .card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:.9rem 1.1rem;margin-bottom:10px}
  .card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
  .card-id{font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:1px}
  .card-title{font-size:14px;font-weight:500;color:var(--color-text-primary);line-height:1.4}
  .task-list{display:flex;flex-direction:column;gap:4px;margin-top:2px}
  .task{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--color-text-secondary);line-height:1.4;padding:3px 0;border-bottom:.5px solid var(--color-border-tertiary)}
  .task:last-child{border-bottom:none}
  .task-check{width:13px;height:13px;border:.5px solid var(--color-border-secondary);border-radius:3px;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--color-background-secondary)}
  .task-check.done{background:var(--color-background-success);border-color:var(--color-border-success)}
  .task-check.done svg{display:block}
  .task-check svg{display:none;width:9px;height:9px}
  .task-text{cursor:pointer;user-select:none}
  .task-text.done{text-decoration:line-through;color:var(--color-text-tertiary)}
  .footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .progress-wrap{display:flex;align-items:center;gap:7px;flex:1}
  .progress-bar{flex:1;height:3px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;border-radius:2px;transition:width .25s}
  .progress-label{font-size:11px;color:var(--color-text-tertiary);min-width:32px;text-align:right}
  .label-chip{font-size:11px;padding:2px 7px;border-radius:20px;border:.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);background:var(--color-background-secondary)}
  .summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.5rem}
  .metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem 1rem}
  .metric-val{font-size:22px;font-weight:500;color:var(--color-text-primary)}
  .metric-lbl{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
</style>

function renderSummary(){
  let total=0, done=0;
  cards.forEach(c=>{ c.tasks.forEach((_,i)=>{ total++; if(getState(c.id,i)) done++; }) });
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('summary').innerHTML = `
    <div class="summary-grid">
      <div class="metric"><div class="metric-val">${cards.length}</div><div class="metric-lbl">Cartões</div></div>
      <div class="metric"><div class="metric-val">${total}</div><div class="metric-lbl">Tarefas</div></div>
      <div class="metric"><div class="metric-val">${done}</div><div class="metric-lbl">Concluídas</div></div>
      <div class="metric"><div class="metric-val">${pct}%</div><div class="metric-lbl">Progresso</div></div>
    </div>`;
}

const STATE = {};
function key(cid,i){ return cid+'-'+i; }
function getState(cid,i){ return !!STATE[key(cid,i)]; }
function toggle(cid,i){
  STATE[key(cid,i)] = !STATE[key(cid,i)];
  renderAll();
}

function cardProgress(c){
  const done = c.tasks.filter((_,i)=>getState(c.id,i)).length;
  return { done, total: c.tasks.length, pct: Math.round(done/c.tasks.length*100) };
}

function renderAll(){
  renderSummary();
  let currentIter = null;
  let html = '';
  cards.forEach(c=>{
    if(c.iterLabel){
      if(currentIter !== null) html += '</div>';
      html += `<div class="iter-section"><div class="iter-label">${c.iterLabel}</div>`;
      currentIter = c.iter;
    }
    const {done,total,pct} = cardProgress(c);
    const tasks = c.tasks.map((t,i)=>{
      const checked = getState(c.id,i);
      return `<div class="task">
        <div class="task-check${checked?' done':''}" onclick="toggle('${c.id}',${i})">
          <svg viewBox="0 0 9 9" fill="none" stroke="var(--color-text-success)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1.5,4.5 3.5,7 7.5,2"/>
          </svg>
        </div>
        <span class="task-text${checked?' done':''}" onclick="toggle('${c.id}',${i})">${t}</span>
      </div>`;
    }).join('');
    html += `<div class="card">
      <div class="card-header">
        <span class="card-id" style="background:${c.labelColor};color:${c.labelText}">${c.label}</span>
        <span class="card-title">${c.title}</span>
      </div>
      <div class="task-list">${tasks}</div>
      <div class="footer">
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${c.bar}"></div></div>
          <span class="progress-label">${done}/${total}</span>
        </div>
        <span class="label-chip">${c.id}</span>
      </div>
    </div>`;
  });
  if(currentIter !== null) html += '</div>';
  document.getElementById('board').innerHTML = html;
}

renderAll();
</script>
